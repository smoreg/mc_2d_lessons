<!DOCTYPE html>
<!--
  Урок 14. Двумерный мир.
  Открой этот файл двойным щелчком — он откроется в браузере.
  Загляни в консоль (F12 -> Console), чтобы увидеть таблицу мира.
-->
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Урок 14 — Двумерный мир</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #9bd3ff; /* цвет неба */
      color: #1a3d16;
      text-align: center;
      padding-top: 20px;
    }
    h1 { font-size: 30px; }
    .hint { color: #2c5d27; font-size: 17px; }
    canvas { border: 3px solid #1a3d16; background: #9bd3ff; }
  </style>
</head>
<body>
  <h1>🗺️ Двумерный мир</h1>
  <p class="hint">Это пустая сетка-карта мира. Открой консоль (F12), чтобы увидеть таблицу.</p>

  <canvas id="game" width="320" height="320"></canvas>

  <script>
    // ===== РАЗМЕР БЛОКА (одинаковый во всём курсе) =====
    const TILE = 32; // один блок — квадрат 32 на 32 пикселя

    // id блоков: 0 — воздух (пусто), позже добавим траву, землю, камень...
    const AIR = 0;

    // ===== РАЗМЕР МИРА В БЛОКАХ =====
    const cols = 10; // сколько столбцов (по горизонтали)
    const rows = 10; // сколько строк (по вертикали)

    // ===== СОЗДАЁМ ПУСТОЙ МИР =====
    // Мир — это таблица (массив из массивов): grid[y][x].
    // Заполняем её воздухом с помощью ДВОЙНОГО ЦИКЛА.
    const grid = [];
    for (let y = 0; y < rows; y++) {     // внешний цикл — по строкам
      const line = [];                   // новая пустая строка
      for (let x = 0; x < cols; x++) {   // внутренний цикл — по столбцам
        line.push(AIR);                  // кладём в строку воздух
      }
      grid.push(line);                   // добавляем готовую строку в мир
    }

    // ===== ПЕЧАТАЕМ РАЗМЕР И ТАБЛИЦУ В КОНСОЛЬ =====
    console.log("Строк (rows):", grid.length);
    console.log("Столбцов (cols):", grid[0].length);
    console.log("Вся таблица мира:");
    console.log(grid);

    // ===== РИСУЕМ ПУСТУЮ СЕТКУ НА ХОЛСТЕ =====
    const canvas = document.getElementById("game"); // нашли холст
    const ctx = canvas.getContext("2d");            // взяли кисточку

    ctx.strokeStyle = "#7fb8e0"; // цвет линий сетки
    for (let y = 0; y < rows; y++) {
      for (let x = 0; x < cols; x++) {
        // Рисуем рамку клетки в нужном месте: столбец x -> пиксель x*TILE.
        ctx.strokeRect(x * TILE, y * TILE, TILE, TILE);
      }
    }

    // ===== ПОПРОБУЙ САМ =====
    // Поставь блок и снова напечатай таблицу:
    // grid[2][3] = 1;
    // console.log(grid);
  </script>
</body>
</html>
