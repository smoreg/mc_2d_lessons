<!DOCTYPE html>
<!--
  Урок 07. Списки (массивы).
  Открой файл двойным щелчком, потом нажми F12 -> вкладка Console.
-->
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Урок 07 — Массивы</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #6dbf63;
      color: #1a3d16;
      text-align: center;
      padding-top: 60px;
    }
    h1 { font-size: 36px; }
    .hint { color: #2c5d27; font-size: 18px; }
  </style>
</head>
<body>
  <h1>📋 Списки (массивы)</h1>
  <p class="hint">Открой консоль (<b>F12</b> → <b>Console</b>), чтобы увидеть список блоков мира.</p>

  <script>
    // ===== СОЗДАЁМ СПИСОК БЛОКОВ МИРА =====

    // Массив - это список значений в квадратных скобках через запятую.
    let world = ["трава", "земля", "камень"];
    console.log("Наш мир:", world);

    // ===== ДОСТАЁМ БЛОКИ ПО ИНДЕКСУ (СЧЁТ С НУЛЯ!) =====

    console.log("Первый блок (индекс 0):", world[0]);   // трава
    console.log("Второй блок (индекс 1):", world[1]);   // земля
    console.log("Третий блок (индекс 2):", world[2]);   // камень

    // ===== ДЛИНА СПИСКА =====

    console.log("Всего блоков в мире:", world.length);   // 3

    // ===== ДОБАВЛЯЕМ НОВЫЙ БЛОК ЧЕРЕЗ .push() =====

    world.push("дерево");   // добавили в конец списка
    console.log("Добавили дерево! Теперь блоков:", world.length);

    // ===== ПЕРЕБИРАЕМ ВЕСЬ СПИСОК ЦИКЛОМ =====

    // Счётчик i идёт от 0 до последнего индекса (i < length).
    console.log("--- Все блоки мира по очереди ---");
    for (let i = 0; i < world.length; i++) {
      console.log("Блок номер", i, "это", world[i]);
    }

    // ===== ПОСЛЕДНИЙ БЛОК =====

    // Последний индекс - это длина минус 1.
    console.log("Последний блок:", world[world.length - 1]);

    // ===== ПОПРОБУЙ САМ =====
    // Добавь свои блоки через world.push("песок") и обнови страницу (F5).
  </script>
</body>
</html>
