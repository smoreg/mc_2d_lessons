<!DOCTYPE html>
<!--
  Урок 28. Дальность действия.
  Открой файл двойным щелчком.
  Копать (левая) и ставить (правая) можно только близко к герою — в пределах круга.
-->
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Урок 28 — Дальность действия</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #2c3e50;
      color: #ecf0f1;
      text-align: center;
      padding-top: 20px;
    }
    h1 { font-size: 28px; }
    .hint { color: #bdc3c7; font-size: 16px; }
    canvas { background: #9bd3ff; border: 3px solid #1a3d16; cursor: pointer; }
  </style>
</head>
<body>
  <h1>📏 Дальность действия</h1>
  <p class="hint">Копай (левая) и ставь (правая) только внутри круга. Далеко — нельзя!</p>

  <canvas id="game"></canvas>

  <script>
    // ===== НАСТРОЙКИ =====
    const TILE = 32;
    const COLS = 16;
    const ROWS = 12;
    const REACH = 5;        // дальность героя в клетках

    const COLORS = {
      1: '#5fbf4f',
      2: '#8b5a2b',
      3: '#9a9a9a',
      4: '#7a4a1e',
    };

    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    canvas.width = COLS * TILE;
    canvas.height = ROWS * TILE;

    // ===== МИР =====
    let grid = [];
    for (let y = 0; y < ROWS; y++) {
      let line = [];
      for (let x = 0; x < COLS; x++) {
        let id = 0;
        if (y === 6) id = 1;
        else if (y > 6 && y < 9) id = 2;
        else if (y >= 9) id = 3;
        line.push(id);
      }
      grid.push(line);
    }

    // ===== ГЕРОЙ (стоит на траве) =====
    const heroX = 5;   // клетка героя по горизонтали
    const heroY = 5;   // клетка героя по вертикали
    // Центр героя (в клетках) — нужен для расчёта расстояния.
    const heroCenterX = heroX + 0.5;
    const heroCenterY = heroY + 0.5;

    let hoverX = -1, hoverY = -1;
    let denyTimer = 0;        // мигание "нельзя" (далеко)
    let denyX = -1, denyY = -1;

    // ===== ФУНКЦИИ МИРА =====
    function getBlock(grid, x, y) {
      if (x < 0 || y < 0 || x >= COLS || y >= ROWS) return 0;
      return grid[y][x];
    }
    function setBlock(grid, x, y, id) {
      if (x < 0 || y < 0 || x >= COLS || y >= ROWS) return;
      grid[y][x] = id;
    }
    function digBlock(grid, x, y) {
      const id = getBlock(grid, x, y);
      if (id === 0) return null;
      setBlock(grid, x, y, 0);
      return id;
    }
    function placeBlock(grid, x, y, id) {
      if (getBlock(grid, x, y) !== 0) return false;
      setBlock(grid, x, y, id);
      return true;
    }

    // Проверяем, дотягивается ли герой до клетки (cx, cy).
    function withinReach(cx, cy) {
      const dx = cx + 0.5 - heroCenterX;   // разница по X (до центра клетки)
      const dy = cy + 0.5 - heroCenterY;   // разница по Y
      const dist = Math.sqrt(dx * dx + dy * dy);
      return dist <= REACH;
    }

    function mouseToCell(e) {
      const rect = canvas.getBoundingClientRect();
      const cx = Math.floor((e.clientX - rect.left) / TILE);
      const cy = Math.floor((e.clientY - rect.top) / TILE);
      return { cx, cy };
    }

    canvas.addEventListener('mousemove', function (e) {
      const cell = mouseToCell(e);
      hoverX = cell.cx;
      hoverY = cell.cy;
    });

    canvas.addEventListener('mousedown', function (e) {
      const cell = mouseToCell(e);

      // Сначала проверяем дальность!
      if (!withinReach(cell.cx, cell.cy)) {
        denyX = cell.cx; denyY = cell.cy; denyTimer = 20;  // мигнём красным
        return;
      }

      if (e.button === 0) {
        digBlock(grid, cell.cx, cell.cy);
      } else if (e.button === 2) {
        placeBlock(grid, cell.cx, cell.cy, 4);   // ставим дерево
      }
    });

    canvas.addEventListener('contextmenu', function (e) { e.preventDefault(); });

    // ===== РИСОВАНИЕ =====
    function draw() {
      ctx.fillStyle = '#9bd3ff';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      for (let y = 0; y < ROWS; y++) {
        for (let x = 0; x < COLS; x++) {
          const id = grid[y][x];
          if (id === 0) continue;
          ctx.fillStyle = COLORS[id];
          ctx.fillRect(x * TILE, y * TILE, TILE, TILE);
          ctx.strokeStyle = 'rgba(0,0,0,0.12)';
          ctx.strokeRect(x * TILE, y * TILE, TILE, TILE);
        }
      }

      // круг дальности вокруг героя
      ctx.strokeStyle = 'rgba(255,255,255,0.6)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(heroCenterX * TILE, heroCenterY * TILE, REACH * TILE, 0, Math.PI * 2);
      ctx.stroke();
      ctx.lineWidth = 1;

      // герой
      ctx.fillStyle = '#d23b3b';
      ctx.fillRect(heroX * TILE, heroY * TILE, TILE, TILE);
      ctx.fillStyle = '#fff';
      ctx.fillRect((heroX + 0.15) * TILE, (heroY + 0.2) * TILE, 6, 6);
      ctx.fillRect((heroX + 0.55) * TILE, (heroY + 0.2) * TILE, 6, 6);

      // рамка под курсором: белая если близко, красная если далеко
      if (hoverX >= 0) {
        ctx.strokeStyle = withinReach(hoverX, hoverY) ? '#fff' : '#ff4444';
        ctx.lineWidth = 2;
        ctx.strokeRect(hoverX * TILE, hoverY * TILE, TILE, TILE);
        ctx.lineWidth = 1;
      }

      // мигание "слишком далеко"
      if (denyTimer > 0) {
        denyTimer--;
        ctx.fillStyle = 'rgba(255, 60, 60, 0.5)';
        ctx.fillRect(denyX * TILE, denyY * TILE, TILE, TILE);
      }

      requestAnimationFrame(draw);
    }
    draw();
  </script>
</body>
</html>
