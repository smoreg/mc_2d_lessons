<!DOCTYPE html>
<!--
  Урок 27. Ставим блоки.
  Открой файл двойным щелчком.
  Левая кнопка — копать, правая — ставить выбранный блок. Блок выбирай кнопками сверху.
-->
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Урок 27 — Ставим блоки</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #2c3e50;
      color: #ecf0f1;
      text-align: center;
      padding-top: 20px;
    }
    h1 { font-size: 28px; }
    .hint { color: #bdc3c7; font-size: 16px; }
    canvas { background: #9bd3ff; border: 3px solid #1a3d16; cursor: pointer; }
    .picker button {
      font-size: 15px;
      padding: 8px 14px;
      margin: 4px;
      border: 2px solid #1a3d16;
      border-radius: 6px;
      cursor: pointer;
    }
    .picker button.active { outline: 3px solid #ffeb3b; }
  </style>
</head>
<body>
  <h1>🧱 Ставим блоки</h1>
  <p class="hint">Левая кнопка — копать, правая — ставить. Выбери блок:</p>

  <div class="picker">
    <button id="btn2" style="background:#8b5a2b; color:#fff;">Земля</button>
    <button id="btn3" style="background:#9a9a9a;">Камень</button>
    <button id="btn4" style="background:#7a4a1e; color:#fff;">Дерево</button>
  </div>

  <br>
  <canvas id="game"></canvas>

  <script>
    // ===== НАСТРОЙКИ МИРА =====
    const TILE = 32;
    const COLS = 16;
    const ROWS = 12;

    const COLORS = {
      1: '#5fbf4f',  // трава
      2: '#8b5a2b',  // земля
      3: '#9a9a9a',  // камень
      4: '#7a4a1e',  // дерево
    };

    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    canvas.width = COLS * TILE;
    canvas.height = ROWS * TILE;

    // ===== СОЗДАЁМ МИР =====
    let grid = [];
    for (let y = 0; y < ROWS; y++) {
      let line = [];
      for (let x = 0; x < COLS; x++) {
        let id = 0;
        if (y === 6) id = 1;
        else if (y > 6 && y < 9) id = 2;
        else if (y >= 9) id = 3;
        line.push(id);
      }
      grid.push(line);
    }

    let selectedBlock = 2;   // какой блок ставим (по умолчанию земля)
    let hoverX = -1, hoverY = -1;

    // ===== ФУНКЦИИ РАБОТЫ С МИРОМ =====
    function getBlock(grid, x, y) {
      if (x < 0 || y < 0 || x >= COLS || y >= ROWS) return 0;
      return grid[y][x];
    }
    function setBlock(grid, x, y, id) {
      if (x < 0 || y < 0 || x >= COLS || y >= ROWS) return;
      grid[y][x] = id;
    }

    // Копать: убрать блок (поставить воздух).
    function digBlock(grid, x, y) {
      const id = getBlock(grid, x, y);
      if (id === 0) return null;
      setBlock(grid, x, y, 0);
      return id;
    }

    // Ставить: только если клетка пустая (воздух).
    function placeBlock(grid, x, y, id) {
      if (getBlock(grid, x, y) !== 0) return false;  // занято
      setBlock(grid, x, y, id);
      return true;
    }

    function mouseToCell(e) {
      const rect = canvas.getBoundingClientRect();
      const cx = Math.floor((e.clientX - rect.left) / TILE);
      const cy = Math.floor((e.clientY - rect.top) / TILE);
      return { cx, cy };
    }

    canvas.addEventListener('mousemove', function (e) {
      const cell = mouseToCell(e);
      hoverX = cell.cx;
      hoverY = cell.cy;
    });

    // Клик мыши: левая — копаем, правая — ставим.
    canvas.addEventListener('mousedown', function (e) {
      const cell = mouseToCell(e);
      if (e.button === 0) {
        digBlock(grid, cell.cx, cell.cy);              // копаем
      } else if (e.button === 2) {
        placeBlock(grid, cell.cx, cell.cy, selectedBlock);  // ставим
      }
    });

    canvas.addEventListener('contextmenu', function (e) { e.preventDefault(); });

    // ===== КНОПКИ ВЫБОРА БЛОКА =====
    const buttons = [
      { el: document.getElementById('btn2'), id: 2 },
      { el: document.getElementById('btn3'), id: 3 },
      { el: document.getElementById('btn4'), id: 4 },
    ];

    function selectButton(id) {
      selectedBlock = id;
      for (let i = 0; i < buttons.length; i++) {
        if (buttons[i].id === id) buttons[i].el.classList.add('active');
        else buttons[i].el.classList.remove('active');
      }
    }
    for (let i = 0; i < buttons.length; i++) {
      buttons[i].el.addEventListener('click', function () {
        selectButton(buttons[i].id);
      });
    }
    selectButton(2);   // выделим землю по умолчанию

    // ===== РИСОВАНИЕ =====
    function draw() {
      ctx.fillStyle = '#9bd3ff';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      for (let y = 0; y < ROWS; y++) {
        for (let x = 0; x < COLS; x++) {
          const id = grid[y][x];
          if (id === 0) continue;
          ctx.fillStyle = COLORS[id];
          ctx.fillRect(x * TILE, y * TILE, TILE, TILE);
          ctx.strokeStyle = 'rgba(0,0,0,0.12)';
          ctx.strokeRect(x * TILE, y * TILE, TILE, TILE);
        }
      }

      if (hoverX >= 0) {
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 2;
        ctx.strokeRect(hoverX * TILE, hoverY * TILE, TILE, TILE);
        ctx.lineWidth = 1;
      }

      requestAnimationFrame(draw);
    }
    draw();
  </script>
</body>
</html>
