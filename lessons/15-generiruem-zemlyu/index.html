<!DOCTYPE html>
<!--
  Урок 15. Генерируем землю.
  Открой этот файл двойным щелчком — он откроется в браузере.
  Загляни в консоль (F12 -> Console), чтобы увидеть таблицу мира.
-->
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Урок 15 — Генерируем землю</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #9bd3ff; /* цвет неба */
      color: #1a3d16;
      text-align: center;
      padding-top: 20px;
    }
    h1 { font-size: 30px; }
    .hint { color: #2c5d27; font-size: 17px; }
    canvas { border: 3px solid #1a3d16; background: #9bd3ff; }
  </style>
</head>
<body>
  <h1>🌍 Генерируем землю</h1>
  <p class="hint">Небо, трава, земля и камень — мир построился сам по правилам!</p>

  <canvas id="game" width="320" height="320"></canvas>

  <script>
    // ===== РАЗМЕР БЛОКА =====
    const TILE = 32;

    // ===== id БЛОКОВ (как во всём курсе) =====
    const AIR = 0;   // воздух
    const GRASS = 1; // трава
    const DIRT = 2;  // земля
    const STONE = 3; // камень

    // ===== РАЗМЕР МИРА =====
    const cols = 10;
    const rows = 10;

    // ===== СОЗДАЁМ ПУСТОЙ МИР (как в прошлом уроке) =====
    const grid = [];
    for (let y = 0; y < rows; y++) {
      const line = [];
      for (let x = 0; x < cols; x++) {
        line.push(AIR);
      }
      grid.push(line);
    }

    // ===== ГЕНЕРИРУЕМ ЛАНДШАФТ =====
    // surface — строка, на которой начинается трава (поверхность земли).
    const surface = 4;

    for (let y = 0; y < rows; y++) {       // по строкам сверху вниз
      for (let x = 0; x < cols; x++) {     // по столбцам
        if (y < surface) {
          grid[y][x] = AIR;                // выше поверхности — небо
        } else if (y === surface) {
          grid[y][x] = GRASS;              // ровно на поверхности — трава
        } else if (y < surface + 4) {
          grid[y][x] = DIRT;               // чуть ниже — земля
        } else {
          grid[y][x] = STONE;              // глубоко — камень
        }
      }
    }

    // Напечатаем таблицу — теперь в ней не только нули.
    console.log("Мир после генерации:");
    console.log(grid);

    // ===== ПРОСТАЯ ОТРИСОВКА =====
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");

    for (let y = 0; y < rows; y++) {
      for (let x = 0; x < cols; x++) {
        const id = grid[y][x]; // что за блок в этой клетке

        // Выбираем цвет по id блока.
        if (id === GRASS) {
          ctx.fillStyle = "#5fbf4f";
          ctx.fillRect(x * TILE, y * TILE, TILE, TILE);
        } else if (id === DIRT) {
          ctx.fillStyle = "#8b5a2b";
          ctx.fillRect(x * TILE, y * TILE, TILE, TILE);
        } else if (id === STONE) {
          ctx.fillStyle = "#9a9a9a";
          ctx.fillRect(x * TILE, y * TILE, TILE, TILE);
        }
        // Если AIR — ничего не рисуем, видно фон неба.
      }
    }

    // ===== ПОПРОБУЙ САМ =====
    // Подними поверхность повыше: const surface = 2;
  </script>
</body>
</html>
