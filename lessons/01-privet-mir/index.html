<!DOCTYPE html>
<!--
  Урок 01. Привет, мир!
  Открой этот файл двойным щелчком — он откроется в браузере.
  А чтобы увидеть секретные сообщения, нажми F12 и выбери вкладку "Console".
-->
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Урок 01 — Привет, мир!</title>
  <style>
    /* Это оформление страницы. Не пугайся — про него будет позже. */
    body {
      font-family: Arial, sans-serif;
      background: #6dbf63;
      color: #1a3d16;
      text-align: center;
      padding-top: 80px;
    }
    h1 { font-size: 40px; }
    .hint { color: #2c5d27; font-size: 18px; }
  </style>
</head>
<body>
  <h1>🧱 Привет, мир!</h1>
  <p class="hint">Нажми <b>F12</b> и открой вкладку <b>Console</b>, чтобы увидеть секретные сообщения.</p>

  <script>
    // ===== ТУТ НАЧИНАЕТСЯ НАШ КОД =====

    // 1) alert показывает всплывающее окошко игроку.
    alert("Привет! Это моя первая программа на JavaScript!");

    // 2) console.log пишет сообщение в консоль (секретное окно программиста).
    console.log("Привет, мир!");
    console.log("Я учусь программировать игру про блоки.");

    // 3) А это комментарий — компьютер его не выполняет.
    // console.log("Эту строчку компьютер не увидит, потому что она закомментирована.");

    // ===== ПОПРОБУЙ САМ =====
    // Поменяй текст выше на свой, сохрани файл и обнови страницу (F5).
  </script>
</body>
</html>
