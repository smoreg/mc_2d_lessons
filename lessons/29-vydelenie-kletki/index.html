<!DOCTYPE html>
<!--
  Урок 29. Выделение клетки.
  Открой файл двойным щелчком.
  Води мышкой: клетка под курсором обводится рамкой.
  Белая рамка — можно дотянуться, серая — слишком далеко.
-->
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Урок 29 — Выделение клетки</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #2c3e50;
      color: #ecf0f1;
      text-align: center;
      padding-top: 20px;
    }
    h1 { font-size: 28px; }
    .hint { color: #bdc3c7; font-size: 16px; }
    canvas { background: #9bd3ff; border: 3px solid #1a3d16; cursor: crosshair; }
  </style>
</head>
<body>
  <h1>✨ Выделение клетки</h1>
  <p class="hint">Води мышкой. Белая рамка — можно копать/строить, серая — далеко.</p>

  <canvas id="game"></canvas>

  <script>
    // ===== НАСТРОЙКИ =====
    const TILE = 32;
    const COLS = 16;
    const ROWS = 12;
    const REACH = 5;

    const COLORS = {
      1: '#5fbf4f',
      2: '#8b5a2b',
      3: '#9a9a9a',
      4: '#7a4a1e',
    };

    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    canvas.width = COLS * TILE;
    canvas.height = ROWS * TILE;

    // ===== МИР =====
    let grid = [];
    for (let y = 0; y < ROWS; y++) {
      let line = [];
      for (let x = 0; x < COLS; x++) {
        let id = 0;
        if (y === 6) id = 1;
        else if (y > 6 && y < 9) id = 2;
        else if (y >= 9) id = 3;
        line.push(id);
      }
      grid.push(line);
    }

    // ===== ГЕРОЙ =====
    const heroX = 5, heroY = 5;
    const heroCenterX = heroX + 0.5;
    const heroCenterY = heroY + 0.5;

    let hoverX = -1, hoverY = -1;   // клетка под курсором

    // ===== ФУНКЦИИ МИРА =====
    function getBlock(grid, x, y) {
      if (x < 0 || y < 0 || x >= COLS || y >= ROWS) return 0;
      return grid[y][x];
    }
    function setBlock(grid, x, y, id) {
      if (x < 0 || y < 0 || x >= COLS || y >= ROWS) return;
      grid[y][x] = id;
    }
    function digBlock(grid, x, y) {
      const id = getBlock(grid, x, y);
      if (id === 0) return null;
      setBlock(grid, x, y, 0);
      return id;
    }
    function placeBlock(grid, x, y, id) {
      if (getBlock(grid, x, y) !== 0) return false;
      setBlock(grid, x, y, id);
      return true;
    }
    function withinReach(cx, cy) {
      const dx = cx + 0.5 - heroCenterX;
      const dy = cy + 0.5 - heroCenterY;
      return Math.sqrt(dx * dx + dy * dy) <= REACH;
    }

    function mouseToCell(e) {
      const rect = canvas.getBoundingClientRect();
      const cx = Math.floor((e.clientX - rect.left) / TILE);
      const cy = Math.floor((e.clientY - rect.top) / TILE);
      return { cx, cy };
    }

    // mousemove — запоминаем клетку под курсором.
    canvas.addEventListener('mousemove', function (e) {
      const cell = mouseToCell(e);
      hoverX = cell.cx;
      hoverY = cell.cy;
    });

    // клик — только если дотягиваемся.
    canvas.addEventListener('mousedown', function (e) {
      const cell = mouseToCell(e);
      if (!withinReach(cell.cx, cell.cy)) return;   // далеко — ничего не делаем
      if (e.button === 0) digBlock(grid, cell.cx, cell.cy);
      else if (e.button === 2) placeBlock(grid, cell.cx, cell.cy, 4);
    });

    canvas.addEventListener('contextmenu', function (e) { e.preventDefault(); });

    // ===== РИСОВАНИЕ =====
    function draw() {
      ctx.fillStyle = '#9bd3ff';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // блоки
      for (let y = 0; y < ROWS; y++) {
        for (let x = 0; x < COLS; x++) {
          const id = grid[y][x];
          if (id === 0) continue;
          ctx.fillStyle = COLORS[id];
          ctx.fillRect(x * TILE, y * TILE, TILE, TILE);
          ctx.strokeStyle = 'rgba(0,0,0,0.12)';
          ctx.strokeRect(x * TILE, y * TILE, TILE, TILE);
        }
      }

      // герой
      ctx.fillStyle = '#d23b3b';
      ctx.fillRect(heroX * TILE, heroY * TILE, TILE, TILE);
      ctx.fillStyle = '#fff';
      ctx.fillRect((heroX + 0.15) * TILE, (heroY + 0.2) * TILE, 6, 6);
      ctx.fillRect((heroX + 0.55) * TILE, (heroY + 0.2) * TILE, 6, 6);

      // ВЫДЕЛЕНИЕ КЛЕТКИ ПОД КУРСОРОМ (рисуем в самом конце)
      if (hoverX >= 0 && hoverX < COLS && hoverY >= 0 && hoverY < ROWS) {
        if (withinReach(hoverX, hoverY)) {
          ctx.strokeStyle = '#ffffff';      // близко — белая яркая рамка
          ctx.lineWidth = 3;
        } else {
          ctx.strokeStyle = 'rgba(180,180,180,0.7)';  // далеко — тусклая серая
          ctx.lineWidth = 2;
        }
        ctx.strokeRect(hoverX * TILE, hoverY * TILE, TILE, TILE);
        ctx.lineWidth = 1;
      }

      requestAnimationFrame(draw);
    }
    draw();
  </script>
</body>
</html>
