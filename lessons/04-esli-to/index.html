<!DOCTYPE html>
<!--
  Урок 04. Если... то... - принятие решений.
  Открой файл двойным щелчком, потом нажми F12 -> вкладка Console.
-->
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Урок 04 — Если… то…</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #6dbf63;
      color: #1a3d16;
      text-align: center;
      padding-top: 60px;
    }
    h1 { font-size: 36px; }
    .hint { color: #2c5d27; font-size: 18px; }
  </style>
</head>
<body>
  <h1>🤔 Если… то…</h1>
  <p class="hint">Открой консоль (<b>F12</b> → <b>Console</b>), чтобы увидеть, как программа принимает решения.</p>

  <script>
    // ===== ПРОВЕРЯЕМ, ЖИВ ЛИ ГЕРОЙ =====

    let health = 80;   // здоровье героя (попробуй поставить 0!)

    // if проверяет условие. Если оно верно (true) - выполняется код в { }.
    if (health > 0) {
      console.log("Герой жив! Здоровье:", health);
    } else {
      // else - "иначе", если условие неверно (false).
      console.log("Game Over 💀");
    }

    // ===== СРАВНЕНИЯ ДАЮТ true ИЛИ false =====

    console.log("10 > 3   это", 10 > 3);    // true
    console.log("5 === 5  это", 5 === 5);   // true
    console.log("2 === 7  это", 2 === 7);   // false

    // ===== ХВАТАЕТ ЛИ РЕСУРСОВ НА ПОСТРОЙКУ =====

    let wood = 5;    // сколько дерева у героя
    let stone = 3;   // сколько камня

    // && (И): нужно, чтобы ОБА условия были верны.
    if (wood >= 2 && stone >= 2) {
      console.log("Хватает на верстак! Строим. 🛠️");
    } else {
      console.log("Не хватает ресурсов. Иди копай ещё!");
    }

    // ===== ДЕНЬ ИЛИ НОЧЬ =====

    let hour = 21;   // который час в игре (0..23)

    // || (ИЛИ): достаточно, чтобы хотя бы одно условие было верным.
    if (hour < 6 || hour >= 20) {
      console.log("Сейчас ночь 🌙 - выходят мобы, будь осторожен!");
    } else {
      console.log("Сейчас день ☀️ - можно спокойно копать.");
    }

    // ===== ПОПРОБУЙ САМ =====
    // Поменяй числа выше и обнови страницу (F5), чтобы увидеть новые решения.
  </script>
</body>
</html>
