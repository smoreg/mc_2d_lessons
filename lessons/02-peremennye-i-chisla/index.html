<!DOCTYPE html>
<!--
  Урок 02. Переменные и числа.
  Открой файл в браузере и нажми F12 -> вкладка Console, чтобы увидеть результат.
-->
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Урок 02 — Переменные и числа</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #6dbf63;
      color: #1a3d16;
      text-align: center;
      padding-top: 60px;
    }
    h1 { font-size: 36px; }
    .hint { color: #2c5d27; font-size: 18px; }
  </style>
</head>
<body>
  <h1>🔢 Переменные и числа</h1>
  <p class="hint">Открой консоль (<b>F12</b> → <b>Console</b>), чтобы увидеть здоровье и очки героя.</p>

  <script>
    // ===== СОЗДАЁМ ПЕРЕМЕННЫЕ ГЕРОЯ =====

    let health = 100;   // здоровье героя (его можно менять — поэтому let)
    let score = 0;      // очки игрока

    const maxHealth = 100;  // максимальное здоровье — оно постоянное (const)

    console.log("Герой создан!");
    console.log("Здоровье:", health);
    console.log("Очки:", score);

    // ===== ГЕРОЙ ПОЛУЧАЕТ УРОН =====

    let damage = 30;            // сколько урона получили
    health = health - damage;   // отнимаем урон от здоровья
    console.log("Ой! Получили урон:", damage);
    console.log("Теперь здоровье:", health);

    // ===== ДОБЫВАЕМ БЛОКИ И ПОЛУЧАЕМ ОЧКИ =====

    // За каждый накопанный блок дают 10 очков.
    score = score + 10;   // накопали 1 блок
    score = score + 10;   // накопали ещё 1 блок
    score = score + 10;   // и ещё 1
    console.log("Накопали блоки! Очки теперь:", score);

    // ===== НЕМНОГО МАТЕМАТИКИ =====

    // Компьютер — отличный калькулятор:
    console.log("2 + 2 =", 2 + 2);
    console.log("10 * 5 =", 10 * 5);
    console.log("Сколько здоровья осталось в процентах:", (health / maxHealth) * 100, "%");

    // ===== ПОПРОБУЙ САМ =====
    // Поменяй числа выше и обнови страницу (F5), чтобы увидеть новый результат.
  </script>
</body>
</html>
